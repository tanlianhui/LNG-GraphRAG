<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password – LNG GraphRAG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }
        .header h1 { font-size: 1.5em; margin-bottom: 8px; }
        .form-wrap { padding: 28px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { opacity: 0.95; }
        .msg { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 0.95em; display: none; }
        .msg.error { background: #f8d7da; color: #721c24; }
        .msg.success { background: #d4edda; color: #155724; }
        .reset-link-wrap { margin-top: 12px; word-break: break-all; font-size: 0.9em; }
        .reset-link-wrap a { color: #667eea; }
        .links { margin-top: 18px; text-align: center; }
        .links a { color: #667eea; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ LNG: LNG Nowledge GraphRAG</h1>
            <p>Reset password</p>
        </div>
        <div class="form-wrap">
            <form id="forgotForm" onsubmit="return submitForgot(event)">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="Enter the email for your account">
                </div>
                <div id="msg" class="msg"></div>
                <div id="resetLinkWrap" class="reset-link-wrap" style="display: none;"></div>
                <button type="submit" class="btn">Send reset link</button>
            </form>
            <div class="links">
                <a href="{{ url_for('login') }}">Back to login</a> · <a href="{{ url_for('index') }}">Dashboard</a>
            </div>
        </div>
    </div>
    <script>
        function submitForgot(e) {
            e.preventDefault();
            var msg = document.getElementById('msg');
            var wrap = document.getElementById('resetLinkWrap');
            msg.style.display = 'none';
            msg.className = 'msg';
            wrap.style.display = 'none';
            wrap.innerHTML = '';
            var email = document.getElementById('email').value.trim().toLowerCase();
            if (!email) {
                msg.textContent = 'Please enter your email.';
                msg.className = 'msg error';
                msg.style.display = 'block';
                return false;
            }
            fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
            .then(function(res) {
                if (res.ok && res.data.success) {
                    msg.textContent = res.data.message || 'If an account exists for that email, a reset link has been created.';
                    msg.className = 'msg success';
                    msg.style.display = 'block';
                    if (res.data.reset_link) {
                        wrap.innerHTML = 'Use this link (valid ~1 hour): <a href="' + res.data.reset_link + '" target="_blank">' + res.data.reset_link + '</a>';
                        wrap.style.display = 'block';
                    }
                } else {
                    msg.textContent = res.data.error || 'Request failed.';
                    msg.className = 'msg error';
                    msg.style.display = 'block';
                }
            })
            .catch(function() {
                msg.textContent = 'Network error.';
                msg.className = 'msg error';
                msg.style.display = 'block';
            });
            return false;
        }
    </script>
</body>
</html>
