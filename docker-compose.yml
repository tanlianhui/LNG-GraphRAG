services:
  neo4j:
    image: neo4j:5.15-community
    container_name: lng-neo4j
    ports:
      # Use 17474/17687 on host to avoid Windows reserved port 7687 (Hyper-V/WSL). Set NEO4J_URI=bolt://localhost:17687 and open http://localhost:17474 for Browser.
      - "127.0.0.1:17474:7474"  # HTTP (Neo4j Browser)
      - "127.0.0.1:17687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      # Host maps bolt 17687->7687; advertise the HOST port so Neo4j Browser
      # (served from :17474) doesn't redirect clients to the unmapped 7687.
      - NEO4J_server_bolt_advertised__address=localhost:17687
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: lng-mysql
    ports:
      - "127.0.0.1:3306:3306"  # localhost only
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: lng_graphrag_auth
      MYSQL_USER: lng_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: lng-adminer
    ports:
      - "127.0.0.1:8080:8080"  # localhost only
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  app:
    build: .
    container_name: lng-app
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      # videos.csv is excluded from the image build (.dockerignore excludes VODs/), but the
      # web app needs it to map each transcription → its source YouTube URL (right-panel player
      # + chunk seek). Mount it read-only so it stays live as new downloads append rows.
      - ./VODs/videos.csv:/app/VODs/videos.csv:ro
      # Player feedback persists on the host, so it survives image rebuilds (the
      # questions DB is baked in and rebuilt per batch; feedback must not be lost).
      - ./quiz_feedback.db:/app/quiz_feedback.db
    env_file:
      - .env
    environment:
      # In-network DNS (override any localhost values from .env)
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=lng_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=lng_graphrag_auth
      # Host Ollama (standardized on 11700)
      - OLLAMA_HOST=http://host.docker.internal:11700
      # Local-LLM hybrid RAG (vector search + concepts → local model answer; no OpenAI)
      - NL_QUERY_LLM=ollama
      - NL_QUERY_MODE=hybrid
      - OLLAMA_NL_MODEL=qwen3.5:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lng-tunnel
    command: tunnel --config /config/cloudflared.yml run
    volumes:
      - ${USERPROFILE}/.cloudflared:/etc/cloudflared:ro
      - ./cloudflared-docker-config.yml:/config/cloudflared.yml:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  mysql_data:

