services:
  neo4j:
    image: neo4j:5.15-community
    container_name: lng-neo4j
    ports:
      # Use 17474/17687 on host to avoid Windows reserved port 7687 (Hyper-V/WSL). Set NEO4J_URI=bolt://localhost:17687 and open http://localhost:17474 for Browser.
      - "127.0.0.1:17474:7474"  # HTTP (Neo4j Browser)
      - "127.0.0.1:17687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/lng-graphrag-password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "lng-graphrag-password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: lng-mysql
    ports:
      - "127.0.0.1:3306:3306"  # localhost only
    environment:
      MYSQL_ROOT_PASSWORD: lng-root-password
      MYSQL_DATABASE: lng_graphrag_auth
      MYSQL_USER: lng_user
      MYSQL_PASSWORD: lng-graphrag-password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plng-root-password"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: lng-adminer
    ports:
      - "127.0.0.1:8080:8080"  # localhost only
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  mysql_data:

